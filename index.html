<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Playground-Editor</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/foldgutter.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/lint/lint.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/dialog/dialog.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/search/matchesonscrollbar.min.css">

<link rel="stylesheet" href="assets/css/style.css">
<style>
  /* ---- Server-side file explorer picker inside modal ---- */
  .modal .picker-area {
    display: none;
    margin-top: 8px;
    border: 1px solid #2a3444;
    border-radius: 6px;
    background: #0d1117;
    overflow: hidden;
  }
  .modal .picker-area.open {
    display: block;
  }
  .modal .picker-toolbar {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 6px 8px;
    background: #161b22;
    border-bottom: 1px solid #2a3444;
  }
  .modal .picker-nav-btn {
    background: #21262d;
    color: #c9d1d9;
    border: 1px solid #30363d;
    border-radius: 4px;
    width: 26px;
    height: 26px;
    font-size: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .modal .picker-nav-btn:hover {
    background: #30363d;
    border-color: #4a9eff;
  }
  .modal .picker-nav-btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }
  .modal .picker-crumb {
    margin-left: 6px;
    font-size: 11px;
    color: #8b9bb4;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    direction: rtl;
    text-align: left;
    flex: 1;
  }
  .modal #modal-picker-tree {
    max-height: 240px;
    overflow-y: auto;
    padding: 4px;
    font-size: 13px;
  }
  .modal .picker-row {
    display: flex;
    align-items: center;
    padding: 5px 8px;
    border-radius: 4px;
    cursor: pointer;
    white-space: nowrap;
    color: #c9d1d9;
  }
  .modal .picker-row:hover {
    background: #1b2330;
  }
  .modal .picker-row.selected {
    background: #1f3a5f;
    color: #fff;
  }
  .modal .picker-row .p-icon {
    margin-right: 8px;
    width: 16px;
    text-align: center;
    flex-shrink: 0;
  }
  .modal .picker-row .p-name {
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
  }
  .modal .picker-row .p-arrow {
    margin-left: auto;
    font-size: 10px;
    color: #6a7a8e;
  }
  .modal .picker-loading,
  .modal .picker-empty {
    color: #6a7a8e;
    padding: 16px;
    text-align: center;
    font-size: 12px;
  }
</style>
</head>
<body>

<div id="app">
  <header>
    <button class="menu-btn" id="btn-toggle-sidebar" title="Toggle Explorer panel (Ctrl+B)">☰</button>
    <div class="app-divider"></div>

    <div class="app-name">Playground-Editor</div>
    <div class="app-divider"></div>

    <button class="menu-btn" id="menu-home">🏠 Home</button>

    <div style="position: relative;">
      <button class="menu-btn" id="menu-file">📄 File <span class="caret">▾</span></button>
      <div class="dropdown" id="menu-file-dropdown">
        <div class="item" data-action="new-file">📄 New File <span class="shortcut">Ctrl+N / Alt+N</span></div>
        <div class="item" data-action="open-file">📂 Open File… <span class="shortcut">Ctrl+O / Alt+O</span></div>
        <div class="separator"></div>
        <div class="item" data-action="new-folder">📁 New Folder <span class="shortcut">Ctrl+Shift+N</span></div>
        <div class="item" data-action="open-folder">📂 Open Folder… <span class="shortcut">Ctrl+Shift+O</span></div>
        <div class="separator"></div>
        <div class="item" data-action="save">💾 Save <span class="shortcut">Ctrl+S</span></div>
        <div class="item" data-action="save-as">💾 Save As… <span class="shortcut">Ctrl+Shift+S</span></div>
        <div class="separator"></div>
        <div class="item" data-action="export-zip">📤 Export Project as ZIP <span class="shortcut">Ctrl+E</span></div>
      </div>
    </div>

    <span class="spacer"></span>
    <span class="filename" id="filename-badge">—</span>
    <span class="spacer"></span>
    <span class="hint-text">Ctrl+N new · Ctrl+Shift+N folder · Ctrl+B explorer</span>
  </header>

  <div id="body">
    <aside id="sidebar">
      <div id="sidebar-header">
        <span>Explorer</span>
        <span class="root-name" id="root-name" title="">workspace</span>
        <span class="spacer"></span>
        <button class="icon-btn" id="btn-refresh" title="Refresh tree">⟳</button>
        <button class="icon-btn" id="btn-reload-snippets" title="Reload snippets">⚡</button>
        <button class="icon-btn" id="btn-new-file-2" title="New File">+</button>
        <button class="icon-btn" id="btn-new-folder-2" title="New Folder">🗀</button>
      </div>
      <div id="explorer"></div>
    </aside>

    <section id="editor-pane">
      <div id="file-tabs"></div>
      <div id="editor-container">
        <textarea id="code"></textarea>
      </div>
    </section>
  </div>
</div>

<div id="modal-backdrop">
  <div class="modal" id="modal-box">
    <h3 id="modal-title">Open File</h3>
    <label id="modal-label" for="modal-input">File path</label>

    <input type="text" id="modal-input" autocomplete="off" spellcheck="false">

    <div class="hint" id="modal-hint"></div>

    <!-- Server-side file explorer picker -->
    <div class="picker-area" id="modal-picker-area">
      <div class="picker-toolbar">
        <button class="picker-nav-btn" id="picker-up" title="Up one level">⬆</button>
        <button class="picker-nav-btn" id="picker-home" title="Workspace root">🏠</button>
        <button class="picker-nav-btn" id="picker-refresh" title="Refresh">⟳</button>
        <span class="picker-crumb" id="modal-picker-path">/</span>
      </div>
      <div id="modal-picker-tree"></div>
    </div>

    <div class="actions">
      <button class="btn secondary" id="modal-cancel">Cancel</button>
      <button class="btn" id="modal-ok">OK</button>
    </div>
  </div>
</div>

<div id="context-menu"></div>
<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/php/php.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/markdown/markdown.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/yaml/yaml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/sql/sql.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/dialog/dialog.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/search/searchcursor.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/search/search.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/search/jump-to-line.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/scroll/annotatescrollbar.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/search/matchesonscrollbar.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/xml-fold.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchtags.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closetag.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/selection/active-line.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/foldcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/foldgutter.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/brace-fold.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/lint/lint.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/lint/json-lint.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<script src="custom-tags.js"></script>
<script src="custom-snippets.js"></script>

<script src="assets/js/main.js"></script>

</body>
</html>
