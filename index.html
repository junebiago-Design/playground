<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Playground-Editor</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/foldgutter.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/lint/lint.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/dialog/dialog.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/search/matchesonscrollbar.min.css">

<style>
  * { box-sizing: border-box; }
  html, body {
    height: 100%; margin: 0; padding: 0;
    font-family: system-ui, sans-serif;
    background: #1e1e1e; color: #ddd; overflow: hidden;
  }
  #app { display: grid; grid-template-rows: auto 1fr; height: 100vh; }

  header {
    display: flex; align-items: center; gap: 4px;
    padding: 6px 10px; background: #252526;
    border-bottom: 1px solid #3c3c3c;
    position: relative; z-index: 500;
  }
  header .spacer { flex: 1; }
  header .hint-text { font-size: 12px; color: #858585; padding-right: 8px; }

  .app-name {
    font-size: 14px; font-weight: 700; letter-spacing: 0.3px;
    padding: 0 8px; user-select: none; cursor: default;
    background: linear-gradient(135deg, #9cdcfe 0%, #c586c0 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .app-divider { width: 1px; height: 18px; background: #3c3c3c; margin: 0 4px; }

  .menu-btn {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 5px 12px; font-size: 13px;
    color: #ddd; background: transparent;
    border: none; border-radius: 4px;
    cursor: pointer; white-space: nowrap;
    font-weight: 500;
  }
  .menu-btn:hover { background: #3c3c3c; color: #fff; }
  .menu-btn.active { background: #094771; color: #fff; }
  .menu-btn .caret { font-size: 9px; opacity: 0.7; }

  .dropdown {
    position: absolute; top: 100%; left: 0;
    background: #2d2d30; border: 1px solid #454545;
    border-radius: 4px; padding: 4px 0; min-width: 300px;
    box-shadow: 0 6px 24px rgba(0,0,0,0.6);
    z-index: 1000; display: none; margin-top: 2px;
  }
  .dropdown.open { display: block; }
  .dropdown .item {
    display: flex; align-items: center; gap: 10px;
    padding: 6px 14px; font-size: 13px;
    color: #ccc; cursor: pointer; white-space: nowrap;
  }
  .dropdown .item:hover { background: #094771; color: #fff; }
  .dropdown .item .shortcut {
    margin-left: auto; font-size: 11px;
    color: #858585; font-family: monospace;
  }
  .dropdown .item:hover .shortcut { color: #ddd; }
  .dropdown .separator { height: 1px; background: #454545; margin: 4px 0; }

  #body { display: grid; grid-template-columns: 280px 1fr; overflow: hidden; }

  #sidebar {
    background: #252526; border-right: 1px solid #3c3c3c;
    display: flex; flex-direction: column; overflow: hidden;
  }
  #sidebar-header {
    display: flex; align-items: center; gap: 4px;
    padding: 8px 10px; border-bottom: 1px solid #3c3c3c;
    font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.5px; color: #858585;
  }
  #sidebar-header .spacer { flex: 1; }
  #sidebar-header .root-name {
    font-size: 11px; color: #9cdcfe;
    text-transform: none; letter-spacing: 0;
    overflow: hidden; text-overflow: ellipsis;
    max-width: 120px; white-space: nowrap;
  }

  .icon-btn {
    background: transparent; border: 1px solid transparent;
    color: #ccc; cursor: pointer; border-radius: 4px;
    width: 24px; height: 24px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 14px; padding: 0;
  }
  .icon-btn:hover { background: #3c3c3c; color: #fff; }

  #explorer { flex: 1; overflow-y: auto; padding: 6px 0; font-size: 13px; }
  #explorer::-webkit-scrollbar { width: 10px; }
  #explorer::-webkit-scrollbar-thumb { background: #3c3c3c; border-radius: 5px; }

  .tree-row {
    display: flex; align-items: center; gap: 4px;
    padding: 3px 8px 3px 6px; cursor: pointer;
    white-space: nowrap; color: #ccc;
    border: 1px dashed transparent;
  }
  .tree-row:hover { background: #2a2d2e; }
  .tree-row.selected { background: #094771; color: #fff; }
  .tree-row.drag-over { border-color: #0e639c; background: #1c2c3c; }
  .tree-row.dragging { opacity: 0.4; }
  .tree-row .arrow {
    width: 12px; text-align: center; font-size: 9px; color: #858585;
    transition: transform 0.15s;
  }
  .tree-row .arrow.open { transform: rotate(90deg); }
  .tree-row .icon { width: 16px; text-align: center; font-size: 12px; }
  .tree-children { margin-left: 12px; display: none; }
  .tree-children.open { display: block; }

  #editor-pane { display: flex; flex-direction: column; overflow: hidden; position: relative; }
  #file-tabs {
    display: flex; align-items: stretch;
    background: #252526; border-bottom: 1px solid #3c3c3c;
    height: 34px; overflow-x: auto;
  }
  .tab {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 0 12px; background: #2d2d2d;
    border-right: 1px solid #252526;
    color: #969696; font-size: 13px;
    cursor: pointer; white-space: nowrap;
    border-top: 1px solid transparent;
  }
  .tab.active {
    background: #1e1e1e; color: #fff;
    border-top: 1px solid #0e639c;
  }
  .tab .close { opacity: 0.5; font-size: 14px; border-radius: 3px; padding: 0 3px; }
  .tab .close:hover { opacity: 1; background: #3c3c3c; }
  .tab .dirty-dot { color: #dcdcaa; font-size: 18px; line-height: 0; }

  #editor-container { flex: 1; overflow: hidden; position: relative; }
  .CodeMirror { height: 100%; font-size: 14px; font-family: 'Fira Code', 'Consolas', monospace; }

  .CodeMirror-dialog {
    background: #2d2d30; border-bottom: 1px solid #0e639c;
    padding: 6px 10px; color: #ddd;
    font-family: system-ui, sans-serif; font-size: 13px;
  }
  .CodeMirror-dialog input {
    background: #1e1e1e; border: 1px solid #454545;
    color: #fff; padding: 4px 8px; border-radius: 3px;
    font-size: 13px; font-family: 'Fira Code', monospace;
    outline: none; width: 240px;
  }
  .CodeMirror-dialog input:focus { border-color: #0e639c; }
  .CodeMirror-dialog button {
    background: #3a3d41; border: none; color: #ddd;
    padding: 4px 10px; margin-left: 6px;
    border-radius: 3px; cursor: pointer; font-size: 12px;
  }
  .CodeMirror-dialog button:hover { background: #4a4d51; }

  .CodeMirror-search-match {
    background: rgba(255, 200, 0, 0.25);
    border-bottom: 1px solid #dcdcaa;
  }
  .cm-searching {
    background: rgba(255, 200, 0, 0.4) !important;
    border-radius: 2px;
  }

  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 10px; font-size: 12.5px; font-weight: 500;
    color: #fff; background: #0e639c;
    border: none; border-radius: 4px;
    cursor: pointer; white-space: nowrap;
  }
  .btn:hover { background: #1177bb; }
  .btn.secondary { background: #3a3d41; }
  .btn.secondary:hover { background: #4a4d51; }

  .filename {
    font-size: 12px; color: #9cdcfe;
    background: #1e1e1e; padding: 4px 10px;
    border-radius: 4px; border: 1px solid #3c3c3c;
  }

  #modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    display: none; align-items: center; justify-content: center;
    z-index: 1000;
  }
  #modal-backdrop.open { display: flex; }
  .modal {
    background: #252526; border: 1px solid #3c3c3c;
    border-radius: 6px; padding: 20px; min-width: 440px;
    max-width: 90vw;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }
  .modal h3 { margin: 0 0 14px; font-size: 15px; color: #fff; }
  .modal label { display: block; font-size: 12px; color: #969696; margin-bottom: 6px; }
  .modal input {
    width: 100%; padding: 8px 10px;
    background: #1e1e1e; border: 1px solid #3c3c3c;
    border-radius: 4px; color: #fff; font-size: 13px;
    outline: none; margin-bottom: 8px;
    font-family: 'Fira Code', 'Consolas', monospace;
  }
  .modal input:focus { border-color: #0e639c; }
  .modal .hint {
    font-size: 11px; color: #858585;
    margin: 0 0 14px 0; display: none;
    font-family: 'Fira Code', 'Consolas', monospace;
  }
  .modal .actions { display: flex; gap: 8px; justify-content: flex-end; }

  #context-menu {
    position: fixed; background: #252526;
    border: 1px solid #3c3c3c; border-radius: 4px;
    padding: 4px 0; font-size: 13px; color: #ccc;
    z-index: 2000; min-width: 180px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.5);
    display: none;
  }
  #context-menu.open { display: block; }
  #context-menu .item { padding: 6px 14px; cursor: pointer; display: flex; align-items: center; gap: 8px; }
  #context-menu .item:hover { background: #094771; color: #fff; }
  #context-menu .separator { height: 1px; background: #3c3c3c; margin: 4px 0; }

  #toast {
    position: fixed; bottom: 20px; left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: #0e639c; color: #fff;
    padding: 10px 18px; border-radius: 6px;
    font-size: 13px; opacity: 0;
    transition: all 0.3s ease;
    z-index: 3000; pointer-events: none;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.error { background: #c0392b; }

  .icon.php  { color: #8892bf; }
  .icon.html { color: #e44d26; }
  .icon.css  { color: #2965f1; }
  .icon.js   { color: #f0db4f; }
  .icon.md   { color: #42a5f5; }
  .icon.json { color: #cbcb41; }
  .icon.xml  { color: #8dc149; }
  .icon.yml  { color: #cb171e; }
  .icon.sql  { color: #e38c00; }
  .icon.folder { color: #dcb67a; }

  .hint-function { color: #6a9955 !important; }
  .hint-constant { color: #4fc1ff !important; }
  .hint-class    { color: #dcdcaa !important; }
  .hint-tag      { color: #ce9178 !important; }
  .hint-snippet  { color: #c586c0 !important; font-weight: 600; }

  .CodeMirror-lint-marker-error { color: #f14c4c; }
  .CodeMirror-foldgutter-open, .CodeMirror-foldgutter-folded { cursor: pointer; }
  .CodeMirror-foldgutter-open:after { content: "▾"; color: #858585; }
  .CodeMirror-foldgutter-folded:after { content: "▸"; color: #858585; }
</style>
</head>
<body>

<div id="app">
  <header>
    <div class="app-name">Playground-Editor</div>
    <div class="app-divider"></div>

    <button class="menu-btn" id="menu-home">🏠 Home</button>

    <div style="position: relative;">
      <button class="menu-btn" id="menu-file">📄 File <span class="caret">▾</span></button>
      <div class="dropdown" id="menu-file-dropdown">
        <div class="item" data-action="new-file">📄 New File <span class="shortcut">Ctrl+N / Alt+N</span></div>
        <div class="item" data-action="open-file">📂 Open File… <span class="shortcut">Ctrl+O / Alt+O</span></div>
        <div class="separator"></div>
        <div class="item" data-action="new-folder">📁 New Folder <span class="shortcut">Ctrl+Shift+N</span></div>
        <div class="item" data-action="open-folder">📂 Open Folder… <span class="shortcut">Ctrl+Shift+O</span></div>
        <div class="separator"></div>
        <div class="item" data-action="save">💾 Save <span class="shortcut">Ctrl+S</span></div>
        <div class="item" data-action="save-as">💾 Save As… <span class="shortcut">Ctrl+Shift+S</span></div>
        <div class="separator"></div>
        <div class="item" data-action="export-zip">📤 Export Project as ZIP <span class="shortcut">Ctrl+E</span></div>
      </div>
    </div>

    <span class="spacer"></span>
    <span class="filename" id="filename-badge">—</span>
    <span class="spacer"></span>
    <span class="hint-text">Ctrl+N new · Ctrl+Shift+N folder · Ctrl+F search</span>
  </header>

  <div id="body">
    <aside id="sidebar">
      <div id="sidebar-header">
        <span>Explorer</span>
        <span class="root-name" id="root-name" title="">workspace</span>
        <span class="spacer"></span>
        <button class="icon-btn" id="btn-refresh" title="Refresh tree">⟳</button>
        <button class="icon-btn" id="btn-reload-snippets" title="Reload snippets">⚡</button>
        <button class="icon-btn" id="btn-new-file-2" title="New File">+</button>
        <button class="icon-btn" id="btn-new-folder-2" title="New Folder">🗀</button>
      </div>
      <div id="explorer"></div>
    </aside>

    <section id="editor-pane">
      <div id="file-tabs"></div>
      <div id="editor-container">
        <textarea id="code"></textarea>
      </div>
    </section>
  </div>
</div>

<div id="modal-backdrop">
  <div class="modal">
    <h3 id="modal-title">New File</h3>
    <label id="modal-label" for="modal-input">File name</label>
    <input type="text" id="modal-input" autocomplete="off" spellcheck="false">
    <div class="hint" id="modal-hint"></div>
    <div class="actions">
      <button class="btn secondary" id="modal-cancel">Cancel</button>
      <button class="btn" id="modal-ok">OK</button>
    </div>
  </div>
</div>

<div id="context-menu"></div>
<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/php/php.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/markdown/markdown.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/dialog/dialog.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/search/searchcursor.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/foldcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/foldgutter.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/brace-fold.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<script src="custom-tags.js"></script>
<script src="custom-snippets.js"></script>

<script>
(function () {
  "use strict";

  var API = "api.php";

  var MODE_MAP = {
    "html": "htmlmixed", "htm": "htmlmixed",
    "php": "php", "css": "css",
    "js": "javascript", "mjs": "javascript",
    "md": "markdown", "markdown": "markdown",
    "json": "javascript", "jsonc": "javascript",
    "xml": "xml", "svg": "xml",
    "yml": "yaml", "yaml": "yaml",
    "sql": "text/x-sql",
    "txt": null
  };

  function extOf(n){ return (n.split(".").pop()||"").toLowerCase(); }

  function modeFor(n){
    var e = extOf(n);
    if (e === "json" || e === "jsonc") {
      return { name: "javascript", json: true };
    }
    return MODE_MAP[e] || "php";
  }

  function iconCharFor(n){
    var e = extOf(n);
    if (e === "php") return "🐘";
    if (e === "html" || e === "htm") return "🌐";
    if (e === "css") return "🎨";
    if (e === "js" || e === "mjs") return "📜";
    if (e === "md" || e === "markdown") return "📝";
    if (e === "json" || e === "jsonc") return "🔧";
    if (e === "xml" || e === "svg") return "📐";
    if (e === "yml" || e === "yaml") return "⚙️";
    if (e === "sql") return "🗄️";
    return "📄";
  }
  function iconClassFor(n){
    var e = extOf(n);
    var known = ["php","html","htm","css","js","mjs","md","markdown",
                 "json","jsonc","xml","svg","yml","yaml","sql"];
    if (known.indexOf(e) !== -1) {
      var cls = e;
      if (e === "htm") cls = "html";
      else if (e === "mjs") cls = "js";
      else if (e === "markdown") cls = "md";
      else if (e === "jsonc") cls = "json";
      else if (e === "svg") cls = "xml";
      else if (e === "yaml") cls = "yml";
      return "icon " + cls;
    }
    return "icon";
  }

  // ---------- Toast ----------
  var toastEl = document.getElementById("toast");
  var toastTimer;
  function toast(msg, isError){
    toastEl.textContent = msg;
    toastEl.classList.toggle("error", !!isError);
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove("show"); }, 2400);
  }

  // ---------- API (robust — checks content-type and reports bad responses) ----------
  function api(action, opts) {
    opts = opts || {};
    var method = opts.method || "GET";
    var body   = opts.body;
    var query  = opts.query || {};
    var url = API + "?action=" + encodeURIComponent(action);
    for (var k in query) {
      if (Object.prototype.hasOwnProperty.call(query, k)) {
        url += "&" + encodeURIComponent(k) + "=" + encodeURIComponent(query[k]);
      }
    }
    var init = { method: method };
    if (body !== undefined) {
      init.headers = { "Content-Type": "application/json" };
      init.body = JSON.stringify(body);
    }
    return fetch(url, init).then(function (r) {
      return r.text().then(function (text) {
        // Try to parse JSON
        var j = null;
        try { j = JSON.parse(text); }
        catch (e) {
          // Show the raw first line so users can diagnose PHP warnings
          var preview = text.slice(0, 200).replace(/\s+/g, " ");
          throw new Error("Bad JSON response: " + preview);
        }
        if (!r.ok || (j && j.error)) throw new Error((j && j.error) || ("HTTP " + r.status));
        return j;
      });
    });
  }

  // ---------- Snippets ----------
  window.customSnippets = window.customSnippets || [];

  function loadSnippetsFromServer() {
    return api("snippets").then(function (data) {
      if (!data || !Array.isArray(data.snippets)) {
        console.warn("Snippets endpoint unexpected data:", data);
        return;
      }
      // Merge: static custom-snippets.js first, server *.json snippets override by trigger
      if (!window._staticSnippets) window._staticSnippets = (window.customSnippets || []).slice();
      var map = {};
      window._staticSnippets.concat(data.snippets).forEach(function (sn) { map[sn.trigger] = sn; });
      window.customSnippets = Object.keys(map).map(function (k) { return map[k]; });
      if (data.errors && data.errors.length) console.warn("Snippet warnings:", data.errors);
      console.log("[snippets] loaded " + (data.snippets.length) + " from " + ((data.files||[]).length) + " file(s)");
    }).catch(function (err) {
      console.warn("Could not load snippets:", err.message);
    });
  }

  // ---------- Snippet engine ----------
  function parseSnippet(template) {
    var text = "", stops = {}, i = 0;
    while (i < template.length) {
      var ch = template[i];
      if (ch === "$" && i + 1 < template.length) {
        var m1 = /^\$\{(\d+)(?::([^}]*))?\}/.exec(template.slice(i));
        if (m1) {
          var num = parseInt(m1[1], 10);
          var def = m1[2] || "";
          stops[num] = { index: text.length, length: def.length };
          text += def; i += m1[0].length; continue;
        }
        var m2 = /^\$(\d+)/.exec(template.slice(i));
        if (m2) {
          var num2 = parseInt(m2[1], 10);
          stops[num2] = { index: text.length, length: 0 };
          i += m2[0].length; continue;
        }
      }
      text += ch; i++;
    }
    var sorted = Object.keys(stops).map(Number)
      .filter(function (n) { return n > 0; })
      .sort(function (a, b) { return a - b; })
      .map(function (n) { return { num: n, index: stops[n].index, length: stops[n].length }; });
    var final = stops[0] ? stops[0].index : text.length;
    return { text: text, stops: sorted, final: final };
  }

  function insertSnippetAt(cm, snippet, from, to) {
    var parsed = parseSnippet(snippet.template);
    var startIdx = cm.indexFromPos(from);
    cm.replaceRange(parsed.text, from, to, "+snippet");
    if (parsed.stops.length > 0) {
      var absStops = parsed.stops.map(function (s) {
        return { from: startIdx + s.index, to: startIdx + s.index + s.length };
      });
      var first = absStops[0];
      cm.setSelection(cm.posFromIndex(first.from), cm.posFromIndex(first.to));
      cm._snippetState = { stops: absStops, current: 1 };
    } else {
      cm.setCursor(cm.posFromIndex(startIdx + parsed.final));
      cm._snippetState = null;
    }
    cm.focus();
  }

  function tryExpandSnippetAtCursor(cm) {
    if (cm.somethingSelected()) return false;
    var cur = cm.getCursor();
    var line = cm.getLine(cur.line);
    var textBefore = line.slice(0, cur.ch);
    var match = /(\w+)$/.exec(textBefore);
    if (!match) return false;
    var word = match[1];
    var snippets = window.customSnippets || [];
    for (var i = 0; i < snippets.length; i++) {
      if (snippets[i].trigger === word) {
        var from = { line: cur.line, ch: cur.ch - word.length };
        insertSnippetAt(cm, snippets[i], from, cur);
        return true;
      }
    }
    return false;
  }

  function handleTab(cm) {
    if (cm._snippetState) {
      var state = cm._snippetState;
      if (state.current < state.stops.length) {
        var s = state.stops[state.current];
        cm.setSelection(cm.posFromIndex(s.from), cm.posFromIndex(s.to));
        state.current++;
        return;
      }
      cm._snippetState = null;
    }
    if (tryExpandSnippetAtCursor(cm)) return;
    if (cm.somethingSelected()) cm.indentSelection("add");
    else cm.replaceSelection("    ", "end");
  }

  // ---------- Hint helper (guarded) ----------
  function makeCustomHintHelper(editor, options) {
    var cur = editor.getCursor();
    var token = editor.getTokenAt(cur);
    var start = token.start, end = token.end;
    var word = editor.getRange({ line: cur.line, ch: start }, cur).toLowerCase();
    var list = [];

    (window.customTags || []).forEach(function (item) {
      if (item.displayText && item.displayText.toLowerCase().indexOf(word) === 0) list.push(item);
    });

    (window.customSnippets || []).forEach(function (s) {
      if (s.trigger && s.trigger.toLowerCase().indexOf(word) === 0) {
        list.push({
          text: s.trigger,
          displayText: s.trigger + "  ⚡ " + (s.description || ""),
          className: "hint-snippet",
          hint: function (cm) {
            insertSnippetAt(cm, s, CodeMirror.Pos(cur.line, start), CodeMirror.Pos(cur.line, end));
          }
        });
      }
    });

    // Guard: anyword may not exist in every build
    try {
      if (typeof CodeMirror.hint.anyword === "function") {
        var anyword = CodeMirror.hint.anyword(editor, options);
        if (anyword && anyword.list) list = list.concat(anyword.list);
      }
    } catch (e) { /* ignore */ }

    return { list: list, from: CodeMirror.Pos(cur.line, start), to: CodeMirror.Pos(cur.line, end) };
  }

  function renderTree() {
    explorerEl.innerHTML = "";
    tree.forEach(function (node) {

  function buildTreeNode(node, parentPath) {
    var path = parentPath.concat(node.name);
    var pathStr = path.join("/");

    var wrap = document.createElement("div");
    var row = document.createElement("div");
    row.className = "tree-row";
    if (selectedNode && selectedNode.path === pathStr) row.classList.add("selected");

    var arrow = document.createElement("span");
    arrow.className = "arrow";
    if (node.type === "folder") {
      var isOpen = !!openFolders[pathStr];
      arrow.textContent = "▶";
      if (isOpen) arrow.classList.add("open");
    }

    var icon = document.createElement("span");
    if (node.type === "folder") { icon.className = "icon folder"; icon.textContent = "📁"; }
    else { icon.className = iconClassFor(node.name); icon.textContent = iconCharFor(node.name); }

    var name = document.createElement("span");
    name.className = "name"; name.textContent = node.name;

    row.appendChild(arrow); row.appendChild(icon); row.appendChild(name);
    wrap.appendChild(row);

    var childrenEl = null;
    if (node.type === "folder") {
      childrenEl = document.createElement("div");
      childrenEl.className = "tree-children";
      if (openFolders[pathStr]) childrenEl.classList.add("open");
      (node.children || []).forEach(function (c) {
        childrenEl.appendChild(buildTreeNode(c, path));
      });
      wrap.appendChild(childrenEl);
    }

    row.addEventListener("click", function () {
      selectedNode = { path: pathStr, node: node };
      renderTree();
      if (node.type === "folder") {
        openFolders[pathStr] = !openFolders[pathStr];
        renderTree();
      } else {
        openFile(pathStr);
      }
    });

    row.addEventListener("contextmenu", function (e) {
      e.preventDefault();
      selectedNode = { path: pathStr, node: node };
      renderTree();
      showContextMenu(e.clientX, e.clientY, pathStr, node);
    });

    row.draggable = true;
    row.addEventListener("dragstart", function (e) {
      dragSourcePath = pathStr;
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", pathStr);
      row.classList.add("dragging");
    });
    row.addEventListener("dragend", function () {
      row.classList.remove("dragging");
      dragSourcePath = null;
      explorerEl.querySelectorAll(".drag-over").forEach(function (el) {
        el.classList.remove("drag-over");
      });
    });

    if (node.type === "folder") {
      row.addEventListener("dragover", function (e) {
        if (!dragSourcePath) return;
        if (pathStr === dragSourcePath) return;
        if (pathStr.indexOf(dragSourcePath + "/") === 0) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = "move";
        row.classList.add("drag-over");
      });
      row.addEventListener("dragleave", function () { row.classList.remove("drag-over"); });
      row.addEventListener("drop", function (e) {
        e.preventDefault();
        row.classList.remove("drag-over");
        if (!dragSourcePath) return;
        var src = dragSourcePath;
        dragSourcePath = null;
        api("move", { method: "POST", body: { src: src, dstDir: pathStr } })
          .then(function () { toast("Moved"); return loadTree(); })
          .catch(function (err) { toast("Move failed: " + err.message, true); });
      });
    }

    return wrap;
  }

  // ---------- Tabs ----------
  var tabsEl = document.getElementById("file-tabs");

  function renderTabs() {
    tabsEl.innerHTML = "";
    openTabs.forEach(function (tab, idx) {
      var el = document.createElement("div");
      el.className = "tab" + (idx === activeTabIndex ? " active" : "");
      el.title = tab.path;

      var nameEl = document.createElement("span");
      nameEl.textContent = tab.name;
      el.appendChild(nameEl);

      if (tab.dirty) {
        var dot = document.createElement("span");
        dot.className = "dirty-dot"; dot.textContent = "●";
        el.appendChild(dot);
      }

      var closeEl = document.createElement("span");
      closeEl.className = "close"; closeEl.textContent = "×";
      closeEl.onclick = function (e) { e.stopPropagation(); closeTab(idx); };
      el.appendChild(closeEl);

      el.onclick = function () { activateTab(idx); };
      tabsEl.appendChild(el);
    });
  }

  function activateTab(idx) {
    if (idx < 0 || idx >= openTabs.length) return;
    if (activeTabIndex >= 0 && activeTabIndex < openTabs.length) {
      openTabs[activeTabIndex].content = editor.getValue();
    }
    activeTabIndex = idx;
    var tab = openTabs[idx];
    ignoreChange = true;
    editor.setValue(tab.content);
    editor.setOption("mode", modeFor(tab.name));
    ignoreChange = false;
    editor._snippetState = null;
    editor.clearHistory && editor.clearHistory();
    editor.focus();
    editor.refresh();
    document.getElementById("filename-badge").textContent = tab.name;
    renderTabs();
  }

  function closeTab(idx) {
    var tab = openTabs[idx];
    if (tab.dirty && !confirm("Discard unsaved changes in " + tab.name + "?")) return;
    openTabs.splice(idx, 1);
    if (openTabs.length === 0) {
      activeTabIndex = -1;
      ignoreChange = true; editor.setValue(""); ignoreChange = false;
      document.getElementById("filename-badge").textContent = "—";
    } else if (idx === activeTabIndex) {
      activateTab(Math.max(0, idx - 1));
    } else if (idx < activeTabIndex) {
      activeTabIndex--;
    }
    renderTabs();
  }

  function openFile(path) {
    for (var i = 0; i < openTabs.length; i++) {
      if (openTabs[i].path === path) { activateTab(i); return; }
    }
    api("read", { query: { path: path } }).then(function (data) {
      openTabs.push({ path: path, name: data.name, content: data.content, dirty: false });
      activateTab(openTabs.length - 1);
    }).catch(function (err) {
      toast("Cannot open: " + err.message, true);
    });
  }

  // ---------- Save ----------
  function saveActiveTab() {
    if (activeTabIndex < 0) { toast("No file open", true); return; }
    var tab = openTabs[activeTabIndex];

    api("save", { method: "POST", body: { path: tab.path, content: content } })
      .then(function () {
        tab.content = content;
        tab.dirty = false;
        renderTabs();
        var badge = document.getElementById("filename-badge");
        var prev = badge.textContent;
        badge.textContent = "✔ Saved";
        setTimeout(function () { badge.textContent = prev; }, 800);
        toast("Saved " + tab.name);
      })
      .catch(function (err) { toast("Save failed: " + err.message, true); });
  }

  function saveAsActiveTab() {
    if (activeTabIndex < 0) { toast("No file open", true); return; }
    var tab = openTabs[activeTabIndex];
    showModal("Save As", "New file path (relative to workspace)", tab.path,

      flushPromise = api("save", {
        method: "POST",
        body: { path: tab.path, content: editor.getValue() }
      }).then(function () { tab.dirty = false; renderTabs(); }).catch(function () {});
    } else {
      flushPromise = Promise.resolve();
    }
    flushPromise.then(buildAndDownloadZip);
  }

  function buildAndDownloadZip() {
    toast("Preparing ZIP…");
    api("export").then(function (data) {
      if (!data || !Array.isArray(data.files)) throw new Error("API returned no file list");
      if (data.files.length === 0) { toast("Nothing to export — folder is empty", true); return; }

      var rootName = (data.root && String(data.root).trim()) || "workspace";
      var zip = new JSZip();
      data.files.forEach(function (f) {
        if (!f || typeof f.path !== "string") return;
        zip.file(f.path, f.content == null ? "" : f.content);
      });

      zip.generateAsync({ type: "blob", compression: "DEFLATE", compressionOptions: { level: 6 } })
        .then(function (blob) {
          var url = URL.createObjectURL(blob);
          var a = document.createElement("a");
          a.href = url; a.download = rootName + ".zip";
          document.body.appendChild(a); a.click();
          document.body.removeChild(a);
          setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
          toast("Exported " + rootName + ".zip (" + data.files.length + " files)");
        }).catch(function (err) {
          toast("ZIP generation failed: " + err.message, true);
        });
    }).catch(function (err) {
      toast("Export failed: " + err.message, true);
    });
  }

  // ---------- Shortcuts ----------
  function handleShortcut(e) {
    var mod = e.ctrlKey || e.metaKey;
    var alt = e.altKey;
    var shift = e.shiftKey;
    var key = (e.key || "").toLowerCase();

    if (mod && !shift && !alt && key === "s") { e.preventDefault(); e.stopPropagation(); saveActiveTab(); return true; }
    if (mod && shift && !alt && key === "s") { e.preventDefault(); e.stopPropagation(); saveAsActiveTab(); return true; }

    if ((mod && !shift && !alt && key === "n") || (!mod && alt && !shift && key === "n")) {
      e.preventDefault(); e.stopPropagation(); promptNewFile(); return true;
    }
    if ((mod && shift && !alt && key === "n") || (!mod && alt && shift && key === "n")) {
      e.preventDefault(); e.stopPropagation(); promptNewFolder(); return true;
    }
    if ((mod && !shift && !alt && key === "o") || (!mod && alt && !shift && key === "o")) {
      e.preventDefault(); e.stopPropagation(); promptOpenFile(); return true;
    }
    if ((mod && shift && !alt && key === "o") || (!mod && alt && shift && key === "o")) {
      e.preventDefault(); e.stopPropagation(); promptOpenFolder(); return true;
    }

    if (mod && !shift && !alt && key === "f") {
      e.preventDefault(); e.stopPropagation();
      if (!editor.hasFocus()) editor.focus();
      setTimeout(function () { CodeMirror.commands.findPersistent(editor); }, 0);
      return true;
    }
    if ((mod && !shift && !alt && key === "h") || (mod && shift && !alt && key === "f")) {
      e.preventDefault(); e.stopPropagation();
      if (!editor.hasFocus()) editor.focus();
      setTimeout(function () { CodeMirror.commands.replace(editor); }, 0);
      return true;
    }
    if (mod && !shift && !alt && key === "g") {
      e.preventDefault(); e.stopPropagation();
      if (!editor.hasFocus()) editor.focus();
      setTimeout(function () { CodeMirror.commands.jumpToLine(editor); }, 0);
      return true;
    }
    if (mod && !shift && !alt && key === "e") {
      e.preventDefault(); e.stopPropagation(); doExportZip(); return true;
    }
    if (key === "escape") { closeDropdown(); hideContextMenu(); return false; }
    return false;
  }

  document.addEventListener("keydown", handleShortcut, true);
  window.addEventListener("keydown", handleShortcut, true);

  document.addEventListener("keypress", function (e) {
    var mod = e.ctrlKey || e.metaKey;
    var key = (e.key || "").toLowerCase();
    if (mod && (key === "n" || key === "o")) e.preventDefault();
  }, true);

  // ---------- Init ----------
  updateRootBadge();
  Promise.all([loadSnippetsFromServer(), loadTree()]).then(function () {
    function firstFile(nodes, prefix) {
      for (var i = 0; i < nodes.length; i++) {
        var n = nodes[i];
        var p = prefix ? prefix + "/" + n.name : n.name;
        if (n.type === "file") return p;
        var inner = firstFile(n.children || [], p);
        if (inner) return inner;
      }
      return null;
    }
    var f = firstFile(tree, "");
    if (f) openFile(f);
    editor.focus();
  });
})();
</script>

</body>
